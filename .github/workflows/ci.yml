name: CI

# Development happens on release/* branches, which reach develop and then main only through pull requests.
on:
  push:
    branches: [ "release/**", develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The .NET MAUI sample has no Linux target; it is built by the sample job below.
      - name: Restore
        run: |
          dotnet restore FastSearch.UnitTests
          dotnet restore PasswordSearch.Benchmark

      - name: Build
        run: |
          dotnet build FastSearch.UnitTests -c Release --no-restore -warnaserror
          dotnet build PasswordSearch.Benchmark -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test FastSearch.UnitTests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack (validation)
        run: dotnet pack FastSearch/FastSearch.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-output
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            FastSearch.UnitTests/TestResults/*.trx

  sample:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401

      - name: Install MAUI workload
        run: dotnet workload install maui --version 10.0.401

      - name: Build PasswordSearch (Mac Catalyst)
        run: dotnet build PasswordSearch/PasswordSearch.csproj -c Release -f net10.0-maccatalyst -warnaserror
