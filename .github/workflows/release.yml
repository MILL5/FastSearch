name: Release

# Publishes to NuGet when a version tag (v1.2.3) is pushed. Tag commits on main, after develop -> main is merged.
# Uses NuGet.org Trusted Publishing for MILL5/FastSearch, release.yml.
on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify the tag matches the package version
        run: |
          version=$(dotnet msbuild FastSearch/FastSearch.csproj -getProperty:Version)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version>"; exit 1; }

      - name: Test
        run: dotnet test FastSearch.UnitTests -c Release

      - name: Prepare release-pinned NuGet README links
        run: python3 scripts/prepare_package_readme.py

      - name: Pack
        run: dotnet pack FastSearch/FastSearch.csproj -c Release -o artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: richcrane

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "FastSearch $GITHUB_REF_NAME" --generate-notes
